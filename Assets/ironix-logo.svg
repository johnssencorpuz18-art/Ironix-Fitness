<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Ironix logo</title>
  <desc id="desc">A single Ironix fitness logo with a barbell, metallic wordmark, and gold X mark.</desc>
  <defs>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8e9"/>
      <stop offset=".24" stop-color="#b9b2a7"/>
      <stop offset=".5" stop-color="#f7f0df"/>
      <stop offset=".78" stop-color="#6b675f"/>
      <stop offset="1" stop-color="#d9d1c5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff0a1"/>
      <stop offset=".34" stop-color="#f7b422"/>
      <stop offset=".74" stop-color="#a66a05"/>
      <stop offset="1" stop-color="#ffd761"/>
    </linearGradient>
    <filter id="depth" x="-8%" y="-18%" width="116%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".62"/>
    </filter>
  </defs>

  <rect width="760" height="260" fill="transparent"/>
  <ellipse cx="380" cy="106" rx="285" ry="82" fill="#f2a23a" opacity=".18"/>

  <g filter="url(#depth)">
    <g transform="translate(66 34)">
      <rect x="0" y="62" width="628" height="18" rx="9" fill="url(#steel)"/>
      <g fill="#0d0e11" stroke="url(#steel)" stroke-width="6">
        <rect x="10" y="29" width="28" height="84" rx="7"/>
        <rect x="43" y="18" width="34" height="106" rx="8"/>
        <rect x="551" y="18" width="34" height="106" rx="8"/>
        <rect x="594" y="29" width="28" height="84" rx="7"/>
      </g>
    </g>

    <g transform="translate(292 14)">
      <path d="M0 26 H124 L102 56 H77 V142 H102 L124 172 H0 L23 142 H48 V56 H23 Z" fill="url(#steel)" stroke="#151515" stroke-width="7" stroke-linejoin="round"/>
      <path d="M162 42 H210 L252 95 L303 42 H353 L279 126 L356 224 H306 L250 157 L198 224 H150 L226 126 Z" fill="url(#steel)" stroke="#151515" stroke-width="7" stroke-linejoin="round"/>
      <path d="M210 178 L340 31 L365 48 L234 196 Z" fill="url(#gold)" stroke="#745005" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(54 171)" filter="url(#depth)">
    <text x="0" y="55" font-family="Impact, Arial Black, sans-serif" font-size="76" font-style="italic" letter-spacing="2" fill="url(#steel)" stroke="#101010" stroke-width="4">IRONI</text>
    <text x="542" y="55" font-family="Impact, Arial Black, sans-serif" font-size="78" font-style="italic" letter-spacing="0" fill="url(#gold)" stroke="#745005" stroke-width="4">X</text>
    <text x="164" y="87" font-family="Arial Black, Arial, sans-serif" font-size="22" letter-spacing="8" fill="#f7b422">STRONGER EVERY DAY</text>
  </g>
</svg>
